<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos de Hielo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<style>
  :root {
    --azul: #0b6fb8; --azul-osc: #084f84; --azul-claro: #e8f3fb;
    --texto: #1f2a37; --suave: #6b7a8c; --borde: #dbe4ee; --fondo: #f4f8fb;
    --rojo: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--fondo); color: var(--texto); font-size: 15px; }
  header { background: linear-gradient(120deg, var(--azul-osc), var(--azul)); color: #fff; padding: 22px 32px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; opacity: .85; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Resumen */
  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; border-left: 5px solid var(--c, var(--azul)); cursor: pointer; transition: transform .1s; }
  .tarjeta:hover { transform: translateY(-2px); }
  .tarjeta.activa { outline: 2px solid var(--c, var(--azul)); }
  .tarjeta .num { font-size: 28px; font-weight: 700; }
  .tarjeta .lbl { color: var(--suave); font-size: 13px; }

  .columnas { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .columnas { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 20px; }
  .panel h2 { margin: 0 0 4px; font-size: 18px; }
  .panel .ayuda { margin: 0 0 16px; color: var(--suave); font-size: 13px; }

  /* Formulario */
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 5px; }
  input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--borde); border-radius: 7px; font: inherit; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--azul-claro); border-color: var(--azul); }
  .btn { border: 0; border-radius: 7px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn-primario { background: var(--azul); color: #fff; width: 100%; margin-top: 18px; }
  .btn-primario:hover { background: var(--azul-osc); }
  .btn-eliminar { background: none; color: var(--rojo); padding: 6px 8px; }
  .btn-eliminar:hover { background: #fdecea; }

  /* Lista */
  .filtros { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .filtros input { flex: 1; min-width: 180px; }
  .filtros select { width: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); padding: 8px 10px; border-bottom: 2px solid var(--borde); }
  td { padding: 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  tr:hover td { background: #fafcfe; }
  .cliente { font-weight: 600; }
  .sub { color: var(--suave); font-size: 13px; }
  .cant { font-weight: 700; font-size: 16px; }
  .estado-sel { width: auto; padding: 5px 8px; border-radius: 20px; font-weight: 600; font-size: 13px; border: 1px solid transparent; background: var(--bg); color: var(--fg); cursor: pointer; }
  .vacio { text-align: center; color: var(--suave); padding: 40px 10px; }
  .tabla-wrap { overflow-x: auto; }

  /* Celular: cada pedido se muestra como tarjeta */
  @media (max-width: 640px) {
    main { padding: 14px; } header { padding: 18px; }
    .columnas > * { min-width: 0; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { position: relative; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    td { border: 0; padding: 3px 0; }
    td:first-child { position: absolute; top: 12px; right: 44px; }
    td:last-child { position: absolute; top: 4px; right: 4px; width: auto; }
    td.cant::before { content: "Cantidad: "; font-weight: 400; color: var(--suave); font-size: 13px; }
    tr:hover td { background: none; }
    .vacio { border: 0; }
  }

  /* Aviso */
  #aviso { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 8px; color: #fff; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; }
  #aviso.ver { opacity: 1; transform: none; }
  #aviso.ok { background: #1e8e5a; } #aviso.error { background: var(--rojo); }
</style>
</head>
<body>
<header>
  <h1>❄️ Pedidos de Hielo</h1>
  <p>Registra pedidos y sigue su estado hasta la entrega</p>
</header>

<main>
  <section class="resumen" id="resumen"></section>

  <div class="columnas">
    <section class="panel">
      <h2>Nuevo pedido</h2>
      <p class="ayuda">Completa los datos y pulsa «Registrar pedido».</p>
      <form id="form">
        <label for="cliente">Cliente</label>
        <input id="cliente" required maxlength="120" placeholder="Ej: Restaurante El Polo">

        <label for="producto">Producto</label>
        <select id="producto" required></select>

        <label for="cantidad">Cantidad (unidades)</label>
        <input id="cantidad" type="number" min="1" max="10000" value="1" required>

        <label for="direccion">Dirección de entrega</label>
        <input id="direccion" required maxlength="250" placeholder="Ej: Calle 45 # 12-30, Bogotá">

        <button class="btn btn-primario" type="submit">Registrar pedido</button>
      </form>
    </section>

    <section class="panel">
      <h2>Pedidos</h2>
      <p class="ayuda">Cambia el estado desde la lista. Haz clic en una tarjeta de arriba para filtrar.</p>
      <div class="filtros">
        <input id="buscar" placeholder="🔍 Buscar por cliente…">
        <select id="filtroEstado"><option value="">Todos los estados</option></select>
        <select id="ordenar">
          <option value="creado_en:desc">Más recientes primero</option>
          <option value="creado_en:asc">Más antiguos primero</option>
          <option value="estado:asc">Por estado</option>
          <option value="cliente:asc">Por cliente (A-Z)</option>
          <option value="cantidad:desc">Mayor cantidad</option>
        </select>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>#</th><th>Cliente / Dirección</th><th>Producto</th><th>Cant.</th><th>Estado</th><th>Fecha</th><th></th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div id="aviso"></div>

<script>
// Nombres legibles y colores de cada estado
const ESTADOS = {
  pendiente:      { txt: "Pendiente",      fg: "#8a5a00", bg: "#fff4d6", c: "#f0b429" },
  en_preparacion: { txt: "En preparación", fg: "#0b5394", bg: "#e3f0fc", c: "#2f80ed" },
  en_camino:      { txt: "En camino",      fg: "#6a3fb5", bg: "#efe8fb", c: "#8e5bd9" },
  entregado:      { txt: "Entregado",      fg: "#17703f", bg: "#e2f6ea", c: "#27ae60" },
  cancelado:      { txt: "Cancelado",      fg: "#9b2c22", bg: "#fdecea", c: "#c0392b" },
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { headers: { "Content-Type": "application/json" }, ...opciones });
  if (r.status === 204) return null;
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = datos.detail;
    throw new Error(Array.isArray(d) ? d.map(e => `${e.loc.at(-1)}: ${e.msg}`).join(" · ") : (d || "Error del servidor"));
  }
  return datos;
}

function aviso(msg, tipo = "ok") {
  const el = $("aviso");
  el.textContent = msg; el.className = `${tipo} ver`;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = tipo, 2800);
}

async function cargarCatalogo() {
  const { productos } = await api("/catalogo");
  $("producto").innerHTML = productos.map(p => `<option>${esc(p)}</option>`).join("");
  $("filtroEstado").innerHTML += Object.entries(ESTADOS).map(([k, e]) => `<option value="${k}">${e.txt}</option>`).join("");
}

async function cargarResumen() {
  const { total, por_estado } = await api("/pedidos/resumen");
  const actual = $("filtroEstado").value;
  $("resumen").innerHTML =
    `<div class="tarjeta ${actual === "" ? "activa" : ""}" data-estado=""><div class="num">${total}</div><div class="lbl">Todos los pedidos</div></div>` +
    Object.entries(ESTADOS).map(([k, e]) =>
      `<div class="tarjeta ${actual === k ? "activa" : ""}" data-estado="${k}" style="--c:${e.c}"><div class="num">${por_estado[k] ?? 0}</div><div class="lbl">${e.txt}</div></div>`
    ).join("");
}

async function cargarPedidos() {
  const params = new URLSearchParams();
  if ($("filtroEstado").value) params.set("estado", $("filtroEstado").value);
  if ($("buscar").value.trim()) params.set("cliente", $("buscar").value.trim());
  const [campo, sentido] = $("ordenar").value.split(":");
  params.set("ordenar_por", campo); params.set("orden", sentido);
  const pedidos = await api("/pedidos?" + params);
  if (!pedidos.length) {
    $("tabla").innerHTML = `<tr><td colspan="7" class="vacio">No hay pedidos para mostrar.<br>Registra el primero con el formulario.</td></tr>`;
    return;
  }
  $("tabla").innerHTML = pedidos.map(p => {
    const e = ESTADOS[p.estado];
    const opciones = Object.entries(ESTADOS).map(([k, x]) => `<option value="${k}" ${k === p.estado ? "selected" : ""}>${x.txt}</option>`).join("");
    return `<tr>
      <td class="sub">${p.id}</td>
      <td><div class="cliente">${esc(p.cliente)}</div><div class="sub">📍 ${esc(p.direccion)}</div></td>
      <td>${esc(p.producto)}</td>
      <td class="cant">${p.cantidad}</td>
      <td><select class="estado-sel" data-id="${p.id}" style="--bg:${e.bg};--fg:${e.fg}">${opciones}</select></td>
      <td class="sub">${esc(p.creado_en.slice(0, 16))}</td>
      <td><button class="btn btn-eliminar" data-eliminar="${p.id}" title="Eliminar pedido">🗑️</button></td>
    </tr>`;
  }).join("");
}

const refrescar = () => Promise.all([cargarResumen(), cargarPedidos()]).catch(e => aviso(e.message, "error"));

// Registrar pedido
$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  try {
    const p = await api("/pedidos", { method: "POST", body: JSON.stringify({
      cliente: $("cliente").value, producto: $("producto").value,
      cantidad: Number($("cantidad").value), direccion: $("direccion").value,
    })});
    ev.target.reset();
    aviso(`Pedido #${p.id} registrado ✔`);
    refrescar();
  } catch (e) { aviso(e.message, "error"); }
});

// Cambiar estado y eliminar (delegación de eventos)
$("tabla").addEventListener("change", async ev => {
  if (!ev.target.matches(".estado-sel")) return;
  try {
    await api(`/pedidos/${ev.target.dataset.id}/estado`, { method: "PATCH", body: JSON.stringify({ estado: ev.target.value }) });
    aviso(`Pedido #${ev.target.dataset.id}: ${ESTADOS[ev.target.value].txt}`);
    refrescar();
  } catch (e) { aviso(e.message, "error"); refrescar(); }
});
$("tabla").addEventListener("click", async ev => {
  const id = ev.target.closest("[data-eliminar]")?.dataset.eliminar;
  if (!id) return;
  const fila = ev.target.closest("tr");
  if (fila.dataset.confirmar !== "1") {   // doble clic de confirmación, sin ventanas emergentes
    fila.dataset.confirmar = "1";
    aviso("Pulsa otra vez 🗑️ para confirmar la eliminación", "error");
    setTimeout(() => delete fila.dataset.confirmar, 3000);
    return;
  }
  try { await api(`/pedidos/${id}`, { method: "DELETE" }); aviso(`Pedido #${id} eliminado`); refrescar(); }
  catch (e) { aviso(e.message, "error"); }
});

// Filtros
$("resumen").addEventListener("click", ev => {
  const t = ev.target.closest(".tarjeta"); if (!t) return;
  $("filtroEstado").value = t.dataset.estado; refrescar();
});
$("filtroEstado").addEventListener("change", refrescar);
$("ordenar").addEventListener("change", cargarPedidos);
let espera; $("buscar").addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(cargarPedidos, 300); });

cargarCatalogo().then(refrescar).catch(e => aviso("No se pudo conectar con la API: " + e.message, "error"));
</script>
</body>
</html>
